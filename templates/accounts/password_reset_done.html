{% extends "auth_base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="text-center">
  <i class="bi bi-envelope-check text-primary" style="font-size:2.5rem;"></i>
  <h1 class="mt-3">Check your inbox</h1>
  <p class="sub">If an account exists for that email, a password reset link is on its way.</p>
  <a class="btn btn-outline-primary" href="{% url 'accounts:login' %}">Back to sign in</a>
</div>
{% endblock %}
