{% extends "auth_base.html" %}
{% block title %}Password changed{% endblock %}
{% block content %}
<div class="text-center">
  <i class="bi bi-shield-check text-success" style="font-size:2.5rem;"></i>
  <h1 class="mt-3">Password updated</h1>
  <p class="sub">You can now sign in with your new password.</p>
  <a class="btn btn-primary" href="{% url 'accounts:login' %}">Sign in</a>
</div>
{% endblock %}
