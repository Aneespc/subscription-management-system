<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#f5f6fa; --card:#ffffff; --text:#1c2333; --muted:#6b7280; --border:#e5e7eb; --accent:#4f46e5; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1220; --card:#181c2f; --text:#e8eaf3; --muted:#9aa3b8; --border:#2a3050; --accent:#818cf8; --danger:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1200px; margin:0 auto; padding:24px 28px 48px; }
  h1 { margin:0 0 4px; font-size:22px; }
  h2 { margin:0 0 12px; font-size:15px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .filters { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:18px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input, select, button { font:inherit; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border-color:var(--border); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; margin-bottom:18px; }
  .card, .panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .card .label { font-size:12px; color:var(--muted); }
  .card .value { font-size:24px; font-weight:650; margin-top:6px; }
  .card .note { font-size:12px; color:var(--muted); margin-top:4px; min-height:15px; }
  .card.danger .value { color:var(--danger); }
  .card.pending .value { color:var(--muted); font-size:18px; font-weight:500; }
  .grid { display:grid; grid-template-columns:2fr 1fr; gap:14px; margin-bottom:18px; }
  @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  .chartbox { position:relative; height:280px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .late { color:var(--danger); }
  #error { display:none; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:14px; }
  .empty { color:var(--muted); padding:16px 0; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Finance Dashboard</h1>
  <div class="sub">Revenue, outstanding balances and overdue invoices. <span id="timing"></span></div>
  <div id="error"></div>

  <form class="filters" id="filters">
    <label>From <input type="date" id="date_from"></label>
    <label>To <input type="date" id="date_to"></label>
    <label>Payment method
      <select id="method">
        <option value="">All</option>
        <option value="CASH">Cash</option>
        <option value="BANK_TRANSFER">Bank transfer</option>
        <option value="CARD">Card</option>
        <option value="UPI">UPI</option>
        <option value="OTHER">Other</option>
      </select>
    </label>
    <label>Group revenue by
      <select id="group">
        <option value="month">Month</option>
        <option value="quarter">Quarter</option>
        <option value="year">Year</option>
      </select>
    </label>
    <button type="submit">Apply</button>
    <button type="button" class="ghost" id="reset">Reset</button>
  </form>

  <section class="cards">
    <div class="card"><div class="label">Revenue received</div><div class="value" id="c-revenue">–</div><div class="note" id="n-revenue"></div></div>
    <div class="card"><div class="label">Outstanding</div><div class="value" id="c-outstanding">–</div><div class="note">Confirmed invoices, unpaid balance</div></div>
    <div class="card danger"><div class="label">Overdue invoices</div><div class="value" id="c-overdue">–</div><div class="note" id="n-overdue"></div></div>
    <div class="card"><div class="label">Total invoices</div><div class="value" id="c-invoices">–</div><div class="note"></div></div>
    <div class="card"><div class="label">Active subscriptions</div><div class="value" id="c-active">–</div><div class="note"></div></div>
    <div class="card"><div class="label">Monthly recurring revenue</div><div class="value" id="c-mrr">–</div><div class="note"></div></div>
  </section>

  <section class="grid">
    <div class="panel"><h2>Revenue received</h2><div class="chartbox"><canvas id="revenueChart"></canvas></div></div>
    <div class="panel"><h2>Payments by method</h2><div class="chartbox"><canvas id="methodChart"></canvas></div></div>
  </section>

  <section class="panel">
    <h2>Overdue invoices <span class="sub" id="overdue-count"></span></h2>
    <div id="overdue-table"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const money = n => Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const style = getComputedStyle(document.documentElement);
Chart.defaults.color = style.getPropertyValue("--muted").trim();
Chart.defaults.borderColor = style.getPropertyValue("--border").trim();
const PALETTE = ["#4f46e5", "#0ea5e9", "#10b981", "#f59e0b", "#ef4444"];
let revenueChart, methodChart;

function queryString() {
  const p = new URLSearchParams();
  for (const id of ["date_from", "date_to", "method", "group"]) {
    const v = $(id).value;
    if (v) p.set(id, v);
  }
  return p.toString();
}

function periodLabel(iso, group) {
  const year = iso.slice(0, 4), month = Number(iso.slice(5, 7));
  if (group === "year") return year;
  if (group === "quarter") return "Q" + (Math.floor((month - 1) / 3) + 1) + " " + year;
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][month - 1] + " " + year;
}

function setCard(id, value, formatter) {
  const el = $(id);
  const card = el.closest(".card");
  if (value === null || value === undefined) {
    el.textContent = "Pending";
    card.classList.add("pending");
  } else {
    el.textContent = formatter ? formatter(value) : value;
    card.classList.remove("pending");
  }
}

function showError(message) {
  const box = $("error");
  box.textContent = message;
  box.style.display = message ? "block" : "none";
}

async function getJSON(url) {
  const res = await fetch(url, { headers: { Accept: "application/json" } });
  if (res.status === 401 || res.status === 403) throw new Error("Not allowed. Log in as a staff user at /admin/ and reload.");
  if (!res.ok) throw new Error("Request failed (" + res.status + ") for " + url);
  return res.json();
}

function renderCharts(report, group) {
  const rev = report.revenue_by_period;
  const revData = {
    labels: rev.map(r => periodLabel(r.period, group)),
    datasets: [{ label: "Revenue", data: rev.map(r => Number(r.total)), backgroundColor: PALETTE[0], borderRadius: 6 }],
  };
  if (revenueChart) revenueChart.destroy();
  revenueChart = new Chart($("revenueChart"), {
    type: "bar", data: revData,
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } },
  });

  const methods = report.payments_by_method;
  const methodData = {
    labels: methods.map(m => m.payment_method.replace("_", " ")),
    datasets: [{ data: methods.map(m => Number(m.total)), backgroundColor: PALETTE }],
  };
  if (methodChart) methodChart.destroy();
  methodChart = new Chart($("methodChart"), {
    type: "doughnut", data: methodData,
    options: { maintainAspectRatio: false, plugins: { legend: { position: "bottom" } } },
  });
}

function renderSummary(s) {
  setCard("c-revenue", s.revenue_received, money);
  $("n-revenue").textContent = s.payments_count + " payments";
  setCard("c-outstanding", s.outstanding_amount, money);
  setCard("c-overdue", s.overdue_invoices);
  $("n-overdue").textContent = money(s.overdue_amount) + " owed";
  setCard("c-invoices", s.total_invoices);
  setCard("c-active", s.active_subscriptions);
  setCard("c-mrr", s.mrr, money);
}

function renderOverdue(data) {
  const rows = data.results.slice(0, 10);
  $("overdue-count").textContent = data.count ? "(showing " + rows.length + " of " + data.count + ")" : "";
  const holder = $("overdue-table");
  holder.replaceChildren();
  if (!rows.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "No overdue invoices.";
    holder.append(p);
    return;
  }
  const table = document.createElement("table");
  const head = table.createTHead().insertRow();
  [["Invoice", ""], ["Due date", ""], ["Days overdue", "num"], ["Total", "num"], ["Paid", "num"], ["Outstanding", "num"]]
    .forEach(([text, cls]) => { const th = document.createElement("th"); th.textContent = text; th.className = cls; head.append(th); });
  const body = table.createTBody();
  const today = new Date();
  rows.forEach(r => {
    const days = Math.floor((today - new Date(r.due_date + "T00:00:00")) / 86400000);
    const tr = body.insertRow();
    [[r.invoice_number, ""], [r.due_date, ""], [days, "num late"], [money(r.total_amount), "num"], [money(r.paid), "num"], [money(r.outstanding), "num late"]]
      .forEach(([text, cls]) => { const td = tr.insertCell(); td.textContent = text; td.className = cls; });
  });
  holder.append(table);
}

async function load() {
  showError("");
  const started = performance.now();
  const qs = queryString();
  try {
    const [report, overdue] = await Promise.all([
      getJSON("/api/dashboard/reports/?" + qs),
      getJSON("/api/dashboard/overdue-invoices/"),
    ]);
    renderSummary(report.summary);
    renderCharts(report, $("group").value);
    renderOverdue(overdue);
    $("timing").textContent = "Loaded in " + Math.round(performance.now() - started) + " ms.";
  } catch (err) {
    showError(err.message);
  }
}

$("filters").addEventListener("submit", e => { e.preventDefault(); load(); });
$("reset").addEventListener("click", () => { $("filters").reset(); load(); });
load();
</script>
</body>
</html>
